  <title>玉掛け作業員</title>
  <desc>片腕を斜め上方へ伸ばし、もう一方の腕を腰の前で曲げた立ち姿勢。ヘルメット・フルハーネス・作業服・安全靴・手袋を着用。作業員のみを描き、吊荷・ワイヤーロープ・吊り具は含めない。</desc>
